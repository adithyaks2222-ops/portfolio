<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141718" />
      <stop offset="100%" stop-color="#1A1E1F" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#sf-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="499" rx="15.5" fill="none" stroke="#283032" stroke-width="1"/>

  <!-- Top Platform Nav -->
  <rect x="0" y="0" width="800" height="50" rx="16" fill="#1A2022"/>
  <rect x="0" y="32" width="800" height="18" fill="#1A2022"/>
  <line x1="0" y1="50" x2="800" y2="50" stroke="#283032" stroke-width="1"/>
  
  <text x="32" y="31" fill="#EA6C11" font-family="'Merriweather', serif" font-size="16" font-weight="700">StarkForge</text>
  <text x="134" y="31" fill="#6B7378" font-family="'Fragment Mono', monospace" font-size="11">/ interactive_learning_engine</text>

  <rect x="660" y="14" width="112" height="24" rx="12" fill="#242D30"/>
  <text x="716" y="30" fill="#F4F3EE" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Track: IMCA Core</text>

  <!-- Left Sidebar: Learning Modules -->
  <g transform="translate(32, 74)">
    <rect width="210" height="396" rx="8" fill="#161B1C" stroke="#252D2F" stroke-width="1"/>
    <text x="18" y="28" fill="#757D82" font-family="'Fragment Mono', monospace" font-size="10" letter-spacing="1">CURRICULUM TRACKS</text>

    <!-- Track 1 -->
    <rect x="12" y="44" width="186" height="44" rx="6" fill="#222B2E"/>
    <text x="24" y="66" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="500">01. Data Structures</text>
    <text x="24" y="80" fill="#10B981" font-family="'Fragment Mono', monospace" font-size="9">100% COMPLETE</text>

    <!-- Track 2 Active -->
    <rect x="12" y="98" width="186" height="54" rx="6" fill="#2E2419" stroke="#EA6C11" stroke-width="1"/>
    <text x="24" y="122" fill="#F4F3EE" font-family="'Inter', sans-serif" font-size="12" font-weight="600">02. Computer Networks</text>
    <text x="24" y="140" fill="#EA6C11" font-family="'Fragment Mono', monospace" font-size="9.5">IN PROGRESS • PACKET LAB</text>

    <!-- Track 3 -->
    <rect x="12" y="162" width="186" height="44" rx="6" fill="#1C2224"/>
    <text x="24" y="184" fill="#8C9398" font-family="'Inter', sans-serif" font-size="12">03. Cybersecurity Labs</text>
    <text x="24" y="198" fill="#5F676B" font-family="'Fragment Mono', monospace" font-size="9">NEXT MODULE</text>

    <!-- Track 4 -->
    <rect x="12" y="216" width="186" height="44" rx="6" fill="#1C2224"/>
    <text x="24" y="238" fill="#8C9398" font-family="'Inter', sans-serif" font-size="12">04. AI &amp; Heuristics</text>
    <text x="24" y="252" fill="#5F676B" font-family="'Fragment Mono', monospace" font-size="9">RESEARCH TOPIC</text>
  </g>

  <!-- Main Interactive Lab Workspace -->
  <g transform="translate(262, 74)">
    <rect width="506" height="396" rx="8" fill="#171C1E" stroke="#252D2F" stroke-width="1"/>

    <!-- Module Header -->
    <text x="24" y="34" fill="#F4F3EE" font-family="'Merriweather', serif" font-size="17" font-weight="700">Lab: TCP Three-Way Handshake Simulation</text>
    <text x="24" y="56" fill="#8C9398" font-family="'Inter', sans-serif" font-size="12">Interactive visual packet trace with step-by-step sequence validation.</text>

    <!-- Interactive Diagram Area -->
    <rect x="24" y="74" width="458" height="190" rx="8" fill="#121617" stroke="#202729" stroke-width="1"/>
    
    <!-- Client Node -->
    <circle cx="90" cy="160" r="28" fill="#1F2629" stroke="#EA6C11" stroke-width="1.5"/>
    <text x="90" y="164" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">CLIENT</text>

    <!-- Server Node -->
    <circle cx="410" cy="160" r="28" fill="#1F2629" stroke="#10B981" stroke-width="1.5"/>
    <text x="410" y="164" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">SERVER</text>

    <!-- Flow Arrows -->
    <!-- SYN -->
    <path d="M 124 136 L 376 136" stroke="#EA6C11" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="376,136 366,131 366,141" fill="#EA6C11"/>
    <text x="250" y="126" fill="#EA6C11" font-family="'Fragment Mono', monospace" font-size="10" text-anchor="middle">1. SYN [Seq = 0]</text>

    <!-- SYN-ACK -->
    <path d="M 376 164 L 124 164" stroke="#10B981" stroke-width="1.5"/>
    <polygon points="124,164 134,159 134,169" fill="#10B981"/>
    <text x="250" y="182" fill="#10B981" font-family="'Fragment Mono', monospace" font-size="10" text-anchor="middle">2. SYN-ACK [Seq = 0, Ack = 1]</text>

    <!-- ACK -->
    <path d="M 124 194 L 376 194" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="376,194 366,189 366,199" fill="#38BDF8"/>
    <text x="250" y="210" fill="#38BDF8" font-family="'Fragment Mono', monospace" font-size="10" text-anchor="middle">3. ACK [Seq = 1, Ack = 1]</text>

    <!-- Interactive Console / Quiz Step -->
    <rect x="24" y="280" width="458" height="90" rx="6" fill="#1E2528" stroke="#2B3639" stroke-width="1"/>
    <text x="40" y="306" fill="#757D82" font-family="'Fragment Mono', monospace" font-size="10">STEP VERIFICATION</text>
    <text x="40" y="328" fill="#F4F3EE" font-family="'Inter', sans-serif" font-size="12">What packet flag establishes the initial synchronization request?</text>
    
    <rect x="40" y="342" width="70" height="20" rx="4" fill="#EA6C11"/>
    <text x="75" y="356" fill="#FFFFFF" font-family="'Fragment Mono', monospace" font-size="10" text-anchor="middle">SYN</text>

    <rect x="120" y="342" width="70" height="20" rx="4" fill="#283336"/>
    <text x="155" y="356" fill="#9BA1A6" font-family="'Fragment Mono', monospace" font-size="10" text-anchor="middle">FIN</text>

    <rect x="200" y="342" width="70" height="20" rx="4" fill="#283336"/>
    <text x="235" y="356" fill="#9BA1A6" font-family="'Fragment Mono', monospace" font-size="10" text-anchor="middle">RST</text>
  </g>
</svg>