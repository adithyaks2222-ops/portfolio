<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="jarvx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1213" />
      <stop offset="100%" stop-color="#14191B" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#jarvx-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="499" rx="15.5" fill="none" stroke="#252D30" stroke-width="1"/>

  <!-- Terminal Window Bar -->
  <rect x="0" y="0" width="800" height="46" rx="16" fill="#171D1F"/>
  <rect x="0" y="30" width="800" height="16" fill="#171D1F"/>
  <line x1="0" y1="46" x2="800" y2="46" stroke="#252D30" stroke-width="1"/>
  
  <circle cx="28" cy="23" r="5" fill="#EF4444"/>
  <circle cx="44" cy="23" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="23" r="5" fill="#10B981"/>

  <text x="400" y="28" fill="#8C9398" font-family="'Fragment Mono', monospace" font-size="12" text-anchor="middle">jarvx — network scanner [pyinstaller standalone v1.2]</text>

  <!-- Terminal Body Content -->
  <g transform="translate(36, 74)">
    <text x="0" y="20" fill="#EA6C11" font-family="'Fragment Mono', monospace" font-size="13" font-weight="600">$ jarvx --target 192.168.1.0/24 --mode deep --risk-score</text>
    
    <text x="0" y="52" fill="#5F696E" font-family="'Fragment Mono', monospace" font-size="11">[+] Validating IPv4 CIDR notation... SUCCESS (254 host addresses calculated)</text>
    <text x="0" y="72" fill="#5F696E" font-family="'Fragment Mono', monospace" font-size="11">[+] Initializing raw socket multi-threaded dispatch pool [32 threads]...</text>
    
    <!-- Banner ASCII -->
    <text x="0" y="104" fill="#F4F3EE" font-family="'Fragment Mono', monospace" font-size="10">  _  _  ____ _  _ _  _    JARVX NETWORK INSPECTOR</text>
    <text x="0" y="118" fill="#F4F3EE" font-family="'Fragment Mono', monospace" font-size="10"> ( \/ )(_  _) \/ )\ \/ )   Socket Engine: AF_INET / SOCK_STREAM</text>
    <text x="0" y="132" fill="#EA6C11" font-family="'Fragment Mono', monospace" font-size="10">  \  /   )(  )  (  )  (    Author: Adithya K S</text>

    <!-- Scan Results Table Box -->
    <rect x="0" y="152" width="728" height="168" rx="6" fill="#111617" stroke="#222B2E" stroke-width="1"/>
    
    <text x="18" y="176" fill="#757F85" font-family="'Fragment Mono', monospace" font-size="11">HOST IP</text>
    <text x="160" y="176" fill="#757F85" font-family="'Fragment Mono', monospace" font-size="11">OPEN PORTS</text>
    <text x="330" y="176" fill="#757F85" font-family="'Fragment Mono', monospace" font-size="11">SERVICE IDENTIFIER</text>
    <text x="510" y="176" fill="#757F85" font-family="'Fragment Mono', monospace" font-size="11">LATENCY</text>
    <text x="630" y="176" fill="#757F85" font-family="'Fragment Mono', monospace" font-size="11">RISK</text>
    <line x1="0" y1="188" x2="728" y2="188" stroke="#1F282B" stroke-width="1"/>

    <!-- Row 1 -->
    <text x="18" y="212" fill="#34D399" font-family="'Fragment Mono', monospace" font-size="12">192.168.1.1</text>
    <text x="160" y="212" fill="#F4F3EE" font-family="'Fragment Mono', monospace" font-size="12">53, 80, 443</text>
    <text x="330" y="212" fill="#9BA1A6" font-family="'Fragment Mono', monospace" font-size="12">Gateway / DNS Resolver</text>
    <text x="510" y="212" fill="#9BA1A6" font-family="'Fragment Mono', monospace" font-size="12">1.2ms</text>
    <text x="630" y="212" fill="#34D399" font-family="'Fragment Mono', monospace" font-size="12">LOW</text>

    <!-- Row 2 -->
    <text x="18" y="240" fill="#34D399" font-family="'Fragment Mono', monospace" font-size="12">192.168.1.15</text>
    <text x="160" y="240" fill="#F4F3EE" font-family="'Fragment Mono', monospace" font-size="12">22, 3306, 8080</text>
    <text x="330" y="240" fill="#9BA1A6" font-family="'Fragment Mono', monospace" font-size="12">OpenSSH / MySQL / Dev HTTP</text>
    <text x="510" y="240" fill="#9BA1A6" font-family="'Fragment Mono', monospace" font-size="12">3.8ms</text>
    <text x="630" y="240" fill="#FBBF24" font-family="'Fragment Mono', monospace" font-size="12">MEDIUM</text>

    <!-- Row 3 -->
    <text x="18" y="268" fill="#34D399" font-family="'Fragment Mono', monospace" font-size="12">192.168.1.104</text>
    <text x="160" y="268" fill="#F87171" font-family="'Fragment Mono', monospace" font-size="12">21, 23, 445</text>
    <text x="330" y="268" fill="#F87171" font-family="'Fragment Mono', monospace" font-size="12">FTP Plaintext / Telnet / SMBv1</text>
    <text x="510" y="268" fill="#9BA1A6" font-family="'Fragment Mono', monospace" font-size="12">4.1ms</text>
    <text x="630" y="268" fill="#EF4444" font-family="'Fragment Mono', monospace" font-size="12" font-weight="600">HIGH (82)</text>

    <!-- Row 4 -->
    <text x="18" y="296" fill="#34D399" font-family="'Fragment Mono', monospace" font-size="12">192.168.1.120</text>
    <text x="160" y="296" fill="#F4F3EE" font-family="'Fragment Mono', monospace" font-size="12">80, 443</text>
    <text x="330" y="296" fill="#9BA1A6" font-family="'Fragment Mono', monospace" font-size="12">Reverse Proxy Nginx</text>
    <text x="510" y="296" fill="#9BA1A6" font-family="'Fragment Mono', monospace" font-size="12">2.4ms</text>
    <text x="630" y="296" fill="#34D399" font-family="'Fragment Mono', monospace" font-size="12">LOW</text>

    <!-- Summary Box -->
    <rect x="0" y="336" width="728" height="54" rx="6" fill="#171D1F" stroke="#252D30" stroke-width="1"/>
    <text x="18" y="358" fill="#EA6C11" font-family="'Fragment Mono', monospace" font-size="11">[COMPLETE] Scanned 254 addresses in 4.82 seconds. 4 live hosts identified.</text>
    <text x="18" y="376" fill="#8C9398" font-family="'Fragment Mono', monospace" font-size="11">> Risk breakdown generated to json/report_20261101.json. Ready.</text>
  </g>
</svg>