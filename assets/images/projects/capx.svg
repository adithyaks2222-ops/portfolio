  <!-- Bottom Log Terminal -->
  <rect x="236" y="356" width="524" height="100" rx="6" fill="#121617" stroke="#222B2E" stroke-width="1"/>
  <text x="250" y="378" fill="#4B5563" font-family="'Fragment Mono', monospace" font-size="10">[CAPX_KERNEL] Monitoring hook established. Intercepting TCP state changes...</text>
  <text x="250" y="396" fill="#10B981" font-family="'Fragment Mono', monospace" font-size="10">[OK] Process table synchronized with NT kernel registry (elapsed: 14ms)</text>
  <text x="250" y="414" fill="#EA6C11" font-family="'Fragment Mono', monospace" font-size="10">[ALERT] Ephemeral socket handshake detected on port 5000 (Python Flask runtime)</text>
  <text x="250" y="432" fill="#9CA3AF" font-family="'Fragment Mono', monospace" font-size="10">> CAPX daemon standby. Ready for user quarantine command.</text>
