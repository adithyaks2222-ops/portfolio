  </defs>

  <rect width="800" height="500" rx="16" fill="url(#capx-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="499" rx="15.5" fill="none" stroke="#2B3234" stroke-width="1"/>

  <!-- Top App Window Bar -->
