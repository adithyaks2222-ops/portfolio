    <text x="405" y="125" fill="#34D399" font-family="'Fragment Mono', monospace" font-size="9" text-anchor="middle">VERIFIED</text>
    <text x="490" y="124" fill="#9BA1A6" font-family="'Fragment Mono', monospace" font-size="11">ACTIVE</text>
