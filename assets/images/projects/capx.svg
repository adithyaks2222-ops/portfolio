    <text x="70" y="88" fill="#F4F3EE" font-family="'Inter', sans-serif" font-size="11" font-weight="500">python_worker.py</text>
    <text x="230" y="88" fill="#8B9499" font-family="'Fragment Mono', monospace" font-size="11">5000 / TCP (HTTP)</text>
    <rect x="370" y="76" width="70" height="18" rx="3" fill="#2E2416"/>
    <text x="405" y="89" fill="#FBBF24" font-family="'Fragment Mono', monospace" font-size="9" text-anchor="middle">LOCAL_DEV</text>
    <text x="490" y="88" fill="#EA6C11" font-family="'Fragment Mono', monospace" font-size="11">LISTENING</text>

