    <text x="12" y="124" fill="#9BA1A6" font-family="'Fragment Mono', monospace" font-size="11">2404</text>
    <text x="70" y="124" fill="#F4F3EE" font-family="'Inter', sans-serif" font-size="11" font-weight="500">system_monitor.dll</text>
    <text x="230" y="124" fill="#8B9499" font-family="'Fragment Mono', monospace" font-size="11">IPC_PIPE</text>
